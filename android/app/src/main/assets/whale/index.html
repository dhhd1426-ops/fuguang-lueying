<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>鲸鱼娘</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
.screen{position:absolute;inset:0;touch-action:none}
#stage{position:absolute;inset:0}#stage canvas{width:100%;height:100%;display:block}
.say{display:none}
.load{position:absolute;left:0;right:0;bottom:30%;text-align:center;font:12.5px/1.6 sans-serif;color:#b4503c;white-space:pre-wrap;padding:0 24px;display:none}
.load.err{display:block}
.dance{position:absolute;z-index:1;opacity:0;pointer-events:none;transform:translateX(-50%) scale(.97);transition:opacity .18s cubic-bezier(.3,0,.8,.15),transform .18s cubic-bezier(.3,0,.8,.15)}
.dance.on{opacity:1;transform:translateX(-50%);transition:opacity .32s cubic-bezier(.2,0,0,1),transform .32s cubic-bezier(.2,0,0,1)}
.heart{position:absolute;z-index:2;pointer-events:none;color:#f47a9a;font-size:22px;font-style:normal;opacity:0;text-shadow:0 1px 6px rgba(244,122,154,.45);animation:heart 1.6s cubic-bezier(.05,.7,.1,1) forwards;will-change:transform,opacity}
@keyframes heart{0%{opacity:0;transform:translate(-50%,0) scale(calc(var(--s)*.4))}15%{opacity:1;transform:translate(-50%,-10px) scale(var(--s))}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-90px) scale(calc(var(--s)*.9))}}
.edit{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .18s cubic-bezier(.3,0,.8,.15)}
.edit.on{opacity:1;transition:opacity .32s cubic-bezier(.2,0,0,1)}
.edit::before{content:"";position:absolute;inset:10px;border:1.5px dashed rgba(160,120,95,.7);border-radius:16px}
.edit .tip{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:rgba(74,64,57,.82);color:#fff;font:12.5px sans-serif;padding:6px 12px;border-radius:999px;white-space:nowrap}
.edit .tools{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
.edit .tools button{border:0;border-radius:999px;padding:11px 20px;font:14px sans-serif;background:#fff;color:#4a4039;box-shadow:0 2px 10px rgba(0,0,0,.12);transition:transform .09s cubic-bezier(.2,0,0,1)}
.edit .tools button:active{transform:scale(.94)}.edit .tools button.pri{background:#cfa588;color:#fff}
@media (prefers-reduced-motion:reduce){.heart{animation:none}}
</style></head><body>
<div class="screen" id="screen">
  <div id="stage"></div>
  <video class="dance" id="dance" playsinline preload="none"></video>
  <div class="say" id="say"></div>
  <div class="load" id="load"><span id="ldt"></span></div>
  <div class="edit" id="edit"><span class="tip">拖动移动 · 双指缩放 · 双击复位</span>
    <div class="tools"><button id="eReset">复位</button><button class="pri" id="eDone">完成</button></div></div>
</div>
<script src="core.js"></script><script src="shim.js"></script><script src="pixi.min.js"></script><script src="cubism4.min.js"></script>
<script src="whale.js"></script>
</body></html>
