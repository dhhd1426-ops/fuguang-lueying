name: Android APK

on:
  push:
    branches: [native-app, main]
    paths:
      - "android/**"
      - "public/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/fuguang-lueying-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: fuguang-lueying-apk
          path: out/*.apk

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-build-${{ github.run_number }}
          name: 浮光掠影 App 第 ${{ github.run_number }} 版
          body: 手机上直接下载下面的 APK 安装。每次更新都用同一个签名，可以直接覆盖安装。
          prerelease: true
          files: out/*.apk
