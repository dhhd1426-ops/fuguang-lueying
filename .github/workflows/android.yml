name: Android APK

on:
  push:
    branches: [native-app, main, check]
    paths:
      - "android/**"
      - "public/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease --console=plain 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        working-directory: android
        run: |
          # 把编译错误写成注解，方便在网页和接口里直接看到
          { grep -E "^e: " build.log | head -n 30; grep -A 30 "What went wrong" build.log | grep -v "^\s*$" | head -n 30; } | head -n 48 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/fuguang-lueying-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: fuguang-lueying-apk
          path: out/*.apk

      - name: Publish to release
        # check 分支只编译验证，不发版；确认没问题再合到 native-app 才出安装包
        if: github.ref != 'refs/heads/check'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-build-${{ github.run_number }}
          name: 浮光掠影 App 第 ${{ github.run_number }} 版
          body: 手机上直接下载下面的 APK 安装。每次更新都用同一个签名，可以直接覆盖安装。
          prerelease: true
          files: out/*.apk
