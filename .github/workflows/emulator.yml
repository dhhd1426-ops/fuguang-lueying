name: Emulator probe

# 提交说明里带「迅雷」时（check 分支）：在安卓模拟器里装上安装包，跑迅雷磁力探测，结果放到 emulator-report 分支
on:
  push:
    branches: [check]
    paths: ["android/**", ".github/workflows/emulator.yml"]
  workflow_dispatch:

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '迅雷')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Fonts
        run: |
          pip install --quiet fonttools
          curl -fsSL -o cg.ttf "https://github.com/google/fonts/raw/main/ofl/cormorantgaramond/CormorantGaramond-Italic%5Bwght%5D.ttf"
          mkdir -p android/app/src/main/res/font
          fonttools varLib.instancer cg.ttf wght=300 -o android/app/src/main/res/font/cormorant_light_italic.ttf
          curl -fsSL -o bm.ttf "https://github.com/google/fonts/raw/main/ofl/bodonimoda/BodoniModa-Italic%5Bopsz%2Cwght%5D.ttf"
          fonttools varLib.instancer bm.ttf wght=600 opsz=28 -o android/app/src/main/res/font/bodoni_moda_semibold_italic.ttf
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew :app:assembleRelease --console=plain -q
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: bash android/probe-emulator.sh
      - name: Report
        if: always()
        run: |
          mkdir -p /tmp/tr && cd /tmp/tr
          [ -f emulator.txt ] || echo "模拟器没跑完" > emulator.txt
          while IFS= read -r line; do echo "::notice::${line}"; done < emulator.txt
          git init -q && git checkout -q -b emulator-report
          git -c user.name=Claude -c user.email=noreply@anthropic.com add -A
          git -c user.name=Claude -c user.email=noreply@anthropic.com commit -q -m "emulator report ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" emulator-report
